[project]
name = "production"
version = "0.1.0"
description = "Simple production example for Gdansk"
readme = "README.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "gdansk",
]

[project.scripts]
main = "production.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
gdansk = { path = "../../", editable = true }

[gdansk.dependencies]
vite = "8.0.14"
"@gdansk/vite" = "file:../../packages/vite"
"@vitejs/plugin-react" = "6.0.2"
react = "19.2.6"
react-dom = "19.2.6"

[gdansk.scripts]
build = "vite build"
dev = "vite"
