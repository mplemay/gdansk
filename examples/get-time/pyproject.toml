[project]
name = "get-time"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "gdansk",
]

[project.scripts]
main = "get_time.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { belgie = false, mcp = false }

[tool.uv.sources]
gdansk = { path = "../../", editable = true }

[gdansk.dependencies]
vite = "8.1.3"
"@gdansk/widget" = "file:../../packages/widget"
"@modelcontextprotocol/ext-apps" = "^1.7.2"
"@modelcontextprotocol/sdk" = "^1.29.0"
react = "19.2.6"
react-dom = "19.2.6"

[gdansk.dependencies.dev]
"@types/react" = "^19.2.15"
"@types/react-dom" = "^19.2.3"
