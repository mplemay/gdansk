[project]
name = "shadcn"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "gdansk",
]

[project.scripts]
main = "shadcn.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { belgie = false, mcp = false }

[tool.uv.sources]
gdansk = { path = "../../", editable = true }

[belgie.dependencies]
vite = "8.0.8"
"@base-ui/react" = "^1.5.0"
"@gdansk/vite" = "^0.1.0"
"@modelcontextprotocol/ext-apps" = "^1.7.2"
"@modelcontextprotocol/sdk" = "^1.29.0"
"@tailwindcss/vite" = "4.3.0"
"@vitejs/plugin-react" = "6.0.2"
class-variance-authority = "^0.7.1"
clsx = "^2.1.1"
lucide-react = "^1.17.0"
react = "19.2.6"
react-dom = "19.2.6"
tailwind-merge = "^3.6.0"

[belgie.dependencies.dev]
"@types/react" = "^19.2.15"
"@types/react-dom" = "^19.2.3"
shadcn = "^4.9.0"
tailwindcss = "^4.3.0"
tw-animate-css = "^1.4.0"

[belgie.scripts]
build = "vite build"
dev = "vite"
