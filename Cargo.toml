[package]
name = "gdansk"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
deno_ast = { version = "=0.53.2", features = ["transpiling"] }
deno_cli = { package = "deno", path = "../deno/cli", default-features = false }
deno_core = { path = "../deno/libs/core" }
locked-tripwire = "=0.1.1"
deno_error = "0.7.1"
ed448-goldilocks = "=0.14.0-pre.10"
elliptic-curve = "=0.14.0-rc.28"
pkcs8 = "=0.11.0-rc.11"
pyo3 = { version = "0.28.2", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.28", features = ["attributes", "tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1.47.1", features = ["rt", "sync"] }
toml_edit = "0.23"
rowan = "=0.15.15"
yaml_parser = "=0.2.1"
