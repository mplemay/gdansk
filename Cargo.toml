[package]
name = "gdansk"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dunce = "1.0"
lightningcss = "1.0.0-alpha.70"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py312"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
rolldown = { git = "https://github.com/rolldown/rolldown.git", tag = "v1.0.1", features = ["experimental"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.45"
