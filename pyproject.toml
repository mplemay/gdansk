[project]
name = "gdansk"
version = "0.1.0"
description = "Interactive UI Tools for MCP Servers"
readme = "readme.md"
license = { text = "MIT" }
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "belgie>=0.25.1",
    "mcp>=2.0.0a1",
    "minijinja>=2,<3",
    "pydantic>=2.12.5",
    "rtoml>=0.13,<0.14",
    "starlette>=1.0.0",
    "watchfiles>=1.1.1",
]

[project.scripts]
gdansk = "gdansk.cli:main"

[dependency-groups]
dev = [
    "anyio>=4",
    "httpx2",
    "prek>=0.3.6",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "rumdl>=0.1.21",
    "ty>=0.0.17",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { belgie = false }

[gdansk.dependencies.dev]
oxfmt = "0.53.0"
oxlint = "1.68.0"
"oxlint-tsgolint" = "0.23.0"

[gdansk.commands]
oxfmt = ["oxfmt"]
oxlint = ["oxlint", "--fix"]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["pyproject.toml"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused (common in __init__.py to re-export symbols)
]
"src/gdansk/**/*.py" = ["D"]
"src/gdansk/cli.py" = [
    "D",
    "T201",   # CLI intentionally writes operational output to stdout
    "C901",   # doctor aggregates many independent checks
    "PLR0912",
    "PLR0915",
]
"src/gdansk/_cli_templates/**" = [
    "INP001", # template snippets are not importable package modules
]
"examples/fastapi/main.py" = [
    "D",      # example entrypoint; docstrings not required
    "INP001", # example entrypoint is intentionally not part of a package
]
"**/__tests__/**/*" = [
    "D", # pydocstyle (i.e. ignore missing/malformed docstrings)
    "ANN001",  # missing type annotation for function argument
    "ANN201",  # missing return type annotation for public function
    "ANN202",  # missing return type annotation for private function
    "B008",    # function call in argument defaults (required for FastAPI Depends)
    "F841",    # local variable assigned but never used
    "FAST002", # FastAPI dependency without Annotated
    "INP001",  # implicit namespace package (tests dir may not need __init__.py)
    "PLR0913", # too many arguments in function definition
    "PLR2004", # magic value used in comparison (fine in test cases)
    "S101",    # use of assert (tests typically use assert directly)
    "S106",    # possible hardcoded password (test secrets are fine)
    "SLF001",  # private member accessed
    "ANN401",  # mock helpers intentionally accept flexible kwargs
    "ARG001",  # fixtures used only for skip side effects
    "PT017",   # SystemExit assertions in CLI harness helpers
    "RUF043",  # pytest match patterns for CLI error messages
    "TC002",   # pytest imported at runtime in test modules
    "TC003",   # pathlib imported at runtime in test modules
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
anyio_mode = "auto"
norecursedirs = ["target", "dist", "build", ".venv", "node_modules"]
markers = [
    "integration: marks tests that hit the database or external services",
]
filterwarnings = [
    "error",
]


[tool.rumdl]
line_length = 120

[tool.rumdl.MD013]
reflow = true
code_blocks = false
tables = false
