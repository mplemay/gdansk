name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prek:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-v8-149.2.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: denoland/setup-deno@v2
        with:
          # Deno CLI is only used for repository TypeScript tooling.
          deno-version: 2.8.2
          cache: true

      - name: Install python dependencies
        run: uv sync --all-groups --all-extras --all-packages

      - name: Install TypeScript package dependencies (Deno)
        shell: bash
        run: |
          set -euo pipefail
          deno install
          for d in packages/vite examples/fastapi/src/mount/views examples/get-time/src/get_time/views examples/production/src/production/views examples/shadcn/src/shadcn/views; do
            (cd "$d" && deno install)
          done

      - uses: j178/prek-action@v2

  test-python:
    name: test (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force -Path 'C:\c' | Out-Null
          "CARGO_HOME=C:\c" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-python-${{ matrix.os }}-v8-149.2.0-${{ runner.arch }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: denoland/setup-deno@v2
        with:
          # Deno CLI is only used for repository TypeScript tooling.
          deno-version: 2.8.2
          cache: true

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --all-packages

      - name: Install example views dependencies (Deno)
        shell: bash
        run: |
          set -euo pipefail
          for d in examples/fastapi/src/mount/views examples/get-time/src/get_time/views examples/shadcn/src/shadcn/views; do
            (cd "$d" && deno install)
          done

      - name: Run tests
        run: uv run pytest
